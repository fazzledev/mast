# Public domain books Mast's passages are cut from. See lib/mast/passages.rb.
#
# Each book has a `key` (the prefix of its passages' ids), its Project
# Gutenberg `id`, the `source` line shown under a passage, and optionally:
#
#   sections  where to cut from: each runs from a line matching `start` to one
#             matching `stop` (regexes). The last match of `start` wins, so a
#             table of contents never counts as the chapter. Without any, the
#             whole book.
#   limit     how many candidates to cut, the most on-topic first (default 60)

books:
  - key: seneca-shortness
    id: 64576
    source: Seneca, On the Shortness of Life (tr. Aubrey Stewart, 1900)
    limit: 30
    sections:
      - { start: 'OF THE SHORTNESS OF LIFE\.', stop: 'THE ELEVENTH BOOK' }

  - key: seneca-peace
    id: 64576
    source: Seneca, Of Peace of Mind (tr. Aubrey Stewart, 1900)
    limit: 20
    sections:
      - { start: 'OF PEACE OF MIND\.', stop: 'OF THE SHORTNESS OF LIFE\.' }

  - key: marcus-aurelius
    id: 15877
    source: Marcus Aurelius, Thoughts (tr. George Long)
    limit: 45

  - key: epictetus
    id: 10661
    source: Epictetus, Discourses and Encheiridion (tr. George Long)
    limit: 55

  - key: james-talks
    id: 16287
    source: William James, Talks to Teachers on Psychology (1899)
    limit: 60
    sections:
      - { start: 'VIII\. THE LAWS OF HABIT', stop: 'IX\. THE ASSOCIATION OF IDEAS' }
      - { start: 'XI\. ATTENTION', stop: 'XII\. MEMORY' }
      - { start: 'XV\. THE WILL', stop: 'I\. THE GOSPEL OF RELAXATION' }
      - { start: 'I\. THE GOSPEL OF RELAXATION', stop: 'II\. ON A CERTAIN BLINDNESS IN HUMAN BEINGS' }

  - key: james-energies
    id: 20768
    source: William James, The Energies of Men (1907)
    limit: 15
    sections:
      - { start: 'THE ENERGIES OF MEN\[1\]', stop: 'THE MORAL EQUIVALENT OF WAR\[1\]' }

