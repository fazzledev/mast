# Where the unblock screen's fetched passages come from. See
# lib/mast/passages.rb for how they are cut, scored and kept.

# Public domain books from Project Gutenberg, limited to the chapters about
# time, habit and attention. Each section runs from a line matching `start` to
# one matching `stop` (regexes); the last match of `start` wins, so a table of
# contents never counts as the chapter.
books:
  - id: 16287
    source: William James, Talks to Teachers on Psychology (1899)
    sections:
      - { start: 'VIII\. THE LAWS OF HABIT', stop: 'IX\. THE ASSOCIATION OF IDEAS' }
  - id: 2274
    source: Arnold Bennett, How to Live on 24 Hours a Day (1908)
    sections:
      - { start: 'THE DAILY MIRACLE', stop: 'End of Project Gutenberg' }
  - id: 64576
    source: Seneca, On the Shortness of Life (tr. Aubrey Stewart, 1900)
    sections:
      - { start: 'OF THE SHORTNESS OF LIFE\.', stop: 'THE ELEVENTH BOOK' }
  - id: 205
    source: Henry David Thoreau, Walden (1854)
    sections:
      - { start: 'Where I Lived, and What I Lived For', stop: 'Reading' }
      - { start: 'Conclusion', stop: 'ON THE DUTY OF CIVIL DISOBEDIENCE' }
  - id: 2680
    source: Marcus Aurelius, Meditations (tr. Meric Casaubon)
    sections:
      - { start: 'THE SECOND BOOK', stop: 'APPENDIX' }
  - id: 45109
    source: Epictetus, The Enchiridion (tr. T. W. Higginson)
    sections:
      - { start: 'THE ENCHIRIDION', stop: 'Footnotes' }

# Blogs searched by topic through their WordPress APIs.
blogs:
  - base: https://calnewport.com
    author: Cal Newport
    terms: [distraction, attention, focus, deep work, smartphone, social media, solitude, digital minimalism, slow productivity]
  - base: https://jamesclear.com
    author: James Clear
    terms: [habits, focus, procrastination, discipline, distraction, identity, motivation, environment, deliberate practice]

